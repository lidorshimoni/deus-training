let done = {};
try { done = JSON.parse(localStorage.getItem('deus-done') || '{}'); } catch(e) { done = {}; }
let filters = { level:'all', track:'all' };

function saveDone(){ localStorage.setItem('deus-done', JSON.stringify(done)); }
function coreMods(){ return MODULES.filter(m => m.track.startsWith('core')); }
function go(id, anchor){
  location.hash = id ? '#/m/' + id : '#/';
  render();
  if (anchor) setTimeout(() => { const el = document.getElementById(anchor); if (el) el.scrollIntoView({behavior:'smooth'}); }, 50);
  else window.scrollTo(0,0);
}
function esc(s){ return s; }

function homeView(){
  const coreCount = coreMods().length;
  const doneCount = coreMods().filter(m => done[m.id]).length;
  const pct = Math.round(doneCount/coreCount*100);
  const visible = MODULES.filter(m =>
    (filters.level==='all' || m.level===filters.level) &&
    (filters.track==='all' || (filters.track==='core' ? m.track.startsWith('core') : m.track.startsWith('adv'))));
  let stages = '';
  for (const t of TRACKS){
    const mods = visible.filter(m => m.track===t.id);
    if (!mods.length) continue;
    stages += `<section class="stage${t.adv?' adv':''}">
      <header class="shead"><h3><span class="n">${t.n}</span>${t.title}</h3><p>${t.note}</p></header>
      <div class="slist">` +
      mods.map(m => `<div class="mod" onclick="go('${m.id}')">
        <div class="mod-main">
          <div class="mod-name">${m.name}${m.star?'<span class="star" title="תוכן מוצע חדש">*</span>':''}</div>
          <div class="mod-meta">${m.kind} · ${m.hours}</div>
        </div>
        <span class="mod-lv"><i class="${LEVEL[m.level].dot}"></i>${LEVEL[m.level].label}${done[m.id]?'<span class="done-mark">✓</span>':''}</span>
      </div>`).join('') + `</div></section>`;
  }
  return `
  <header class="hero">
    <div class="kicker">אתר החפיפה של צוות ה-AI</div>
    <h1>מסלול אחד מסודר, מהמודל הראשון עד סוכן שעובד.</h1>
    <p>כל מודול הוא שיעור קצר בעברית עם תרגיל. מתקדמים בסדר, מסמנים מה שסיימתם, ויודעים בדיוק מה נשאר.</p>
    <div class="cta">
      <button class="primary" onclick="go('','stages')">להתחיל את המסלול</button>
      <a class="secondary" onclick="go('','how')">איך המסלול בנוי</a>
    </div>
    <div class="heroline">${coreCount} מודולי ליבה · כ-38 שעות · 3 שלבים ושתי העמקות לפי תפקיד</div>
  </header>
  <div class="progress"><div class="in">
    <span class="lbl">ההתקדמות שלי בליבה</span>
    <div class="bar"><div class="fill" style="width:${Math.max(pct,1)}%"></div></div>
    <span class="num">${doneCount} מתוך ${coreCount} · נשמר בדפדפן</span>
  </div></div>
  <section class="how" id="how">
    <h2>איך זה עובד</h2>
    <ul>
      <li>שלושה שלבי ליבה שכולם עוברים, ואז העמקה לפי התפקיד שלכם בצוות.</li>
      <li>כל מודול נפתח בשיעור קצר שנכתב במיוחד, ונגמר בתרגיל מעשי.</li>
      <li>התקדמות נשמרת בדפדפן שלכם בלבד. אין חשבון, אין מעקב.</li>
    </ul>
  </section>
  <div class="filters" id="stages">
    <div class="fgroup"><span class="flabel">רמה</span><div class="chips">
      ${['all','basic','mid','adv'].map(v=>`<button class="chip${filters.level===v?' on':''}" onclick="setF('level','${v}')">${{all:'הכל',basic:'בסיסי',mid:'בינוני',adv:'מתקדם'}[v]}</button>`).join('')}
    </div></div>
    <div class="fgroup"><span class="flabel">מסלול</span><div class="chips">
      ${['all','core','adv'].map(v=>`<button class="chip${filters.track===v?' on':''}" onclick="setF('track','${v}')">${{all:'הכל',core:'ליבה',adv:'העמקה'}[v]}</button>`).join('')}
    </div></div>
  </div>
  ${stages}
  <footer class="footer">
    Deus Training · סימון * מציין תוכן מוצע חדש שטרם אושר · הקוד פתוח ב־<a href="https://github.com/lidorshimoni/deus-training">GitHub</a>
  </footer>`;
}

function moduleView(id){
  const m = MODULES.find(x => x.id===id);
  if (!m) return `<div class="page"><a class="back" onclick="go('')">→ חזרה למסלול</a><p class="pmeta" style="margin-top:30px">המודול לא נמצא.</p></div>`;
  const t = TRACKS.find(x => x.id===m.track);
  const isDone = !!done[m.id];
  return `<div class="page">
    <a class="back" onclick="go('')">→ חזרה למסלול</a>
    <div class="eyebrow">${t.n} · ${t.title}</div>
    <h2 class="ptitle">${m.name}</h2>
    <div class="pmeta">${LEVEL[m.level].label} · ${m.kind} · כ${m.hours}</div>
    <div class="sec"><h4>מה לומדים כאן</h4><p class="text">${m.about}</p></div>
    ${m.lesson ? `<div class="sec"><h4>השיעור</h4><div class="lesson">${m.lesson.map(p=>`<p>${p}</p>`).join('')}</div></div>` : ''}
    <div class="sec"><h4>הנקודות העיקריות</h4><ul class="points">${m.points.map(p=>`<li>${p}</li>`).join('')}</ul></div>
    <div class="sec"><h4>תרגיל</h4><div class="quiz"><div class="q-label">לתרגל</div>${m.exercise}</div></div>
    <div class="credit">${m.credit}</div>
    <button class="done-btn${isDone?' is-done':''}" onclick="toggleDone('${m.id}')">${isDone?'סומן כהושלם':'סיימתי את המודול'}</button>
    <div class="done-note">הסימון נשמר בדפדפן שלכם בלבד</div>
  </div>`;
}

function setF(k,v){ filters[k]=v; render(); }
function toggleDone(id){ done[id]=!done[id]; if(!done[id]) delete done[id]; saveDone(); render(); }
function render(){
  const h = location.hash;
  const match = h.match(/^#\/m\/(\w+)/);
  document.getElementById('app').innerHTML = match ? moduleView(match[1]) : homeView();
}
window.addEventListener('hashchange', render);
render();
</script>
