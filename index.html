{ id:'m6', name:'Skills, Hooks ו־CLAUDE.md', lv:'בסיס', time:'שבועות 3-4', dur:'כ־4 שעות', track:'core2',

  lesson: [

{ id:'m7', name:'Building Effective Agents', lv:'בינוני', time:'שבועות 3-4', dur:'כ־4 שעות', track:'core2',
  goal:'להכיר את דפוסי הסוכנים הנפוצים ולדעת מתי צריך סוכן ומתי מספיק צ׳אט.',
  about:'הדפוסים שחוזרים בכל מערכת מבוססת סוכנים, והשאלה הקריטית: מתי בכלל צריך אחד.',
  videos: [],
  lesson: [
    'המונח "סוכן" מכסה היום המון דברים שונים, והבלבול הזה יקר. הנוסחה הכי מועילה: workflow - רצף צעדים שתכננת מראש, שבהם המודל הוא חלק אחד; agent - לולאה שבה המודל מחליט בעצמו מה הצעד הבא, על סמך התוצאות. הראשון צפוי וזול, השני גמיש ויקר.',
    'הדפוסים שחוזרים: prompt chaining (פיצול משימה לצעדים מסודרים), routing (בחירת מסלול לפי סוג הבקשה), parallelization (פיצול למשימות מקבילות ואיחוד), orchestrator-workers (סוכן מנהל שמחלק עבודה), ו-evaluator-optimizer (לולאת יצירה וביקורת). כמעט כל מערכת שתראה היא הרכבה של אלה.',
    'הכלל החשוב מכולם: תתחיל מהפתרון הכי פשוט שעובד. אם הנחיה אחת מספיקה - אל תבנה סוכן. אם workflow קבוע מספיק - אל תיתן למודל לבחור צעדים. סוכן מלא שווה את המורכבות רק כשהמסלול לא ידוע מראש והסביבה משתנה.',
    'בסוף המודול תדע לנתח מערכת שאתה רואה ולומר: זה chaining, זה routing, וכאן יש לולאת סוכן - ואיפה היית מפשט.'
  ],
  quiz:'קח מערכת אמיתית מהעבודה שלך (או מהמודולים הקודמים) וצייר את הדפוס שלה: איזה רכיבים יש, מי מחליט מה, והאם היא באמת צריכה להיות סוכן.',
  credit:'מבוסס על מסמך ההדרכה הפנימי של הצוות.' },
{ id:'m8', name:'Harness Engineering', lv:'בינוני', time:'שבועות 4-5', dur:'כ־4 שעות', track:'core2',
  goal:'ללמוד לתכנן את מה שמסביב למודל - לא רק את המודל עצמו.',
  about:'ההנדסה שמסביב למודל: כלים, זיכרון, ובקרה על סוכנים ארוכי־טווח.',
  videos: [],
  lesson: [
    'כשרוצים שהסוכן יעבוד טוב לאורך זמן, הבעיה העיקרית היא לא הפרומפט אלא ה־harness - כל מה שמסביב למודל: איזה כלים יש לו, איך הוא שומר ומושך זיכרון, איך מוגבלת הפעולה שלו, ואיך הוא יודע מתי הוא סיים. מודל מעולה בתוך harness גרוע ייתן תוצאות גרועות.',
    'שלוש שאלות מנחות: מה הסוכן רואה (איזה הקשר נכנס לחלון בכל צעד), מה הוא יכול לעשות (אילו כלים, עם אילו הרשאות), ואיך הוא נבלם (מגבלות, נקודות אישור אנושי, ועצירה). מערכת טובה עונה על שלושתן במפורש ולא במקרה.',
    'דוגמה קלאסית: סוכן שרץ הרבה צעדים ימלא את חלון ההקשר בפלטים ישנים. הפתרון הוא לא חלון גדול יותר אלא עיצוב זיכרון - מה נשמר, מה מסוכם, ומה נזרק. אותה לוגיקה חוזרת בכל מערכת ארוכת־טווח.',
    'רכיב אחרון שאסור לוותר עליו הוא <b>תצפית</b> (observability): רישום מסודר של כל צעד שהסוכן עשה - איזו החלטה, איזו קריאת כלי, כמה טוקנים וכמה זמן. בלי traces אי אפשר לדבג סוכן ואי אפשר לבנות evals אמיתיים (זה גם חומר הגלם למודול ההערכה). כלים מקובלים לזה הם פלטפורמות observability ייעודיות ל-LLM, אבל גם לוג טקסט מסודר בהתחלה שווה הרבה.'
  ],
  quiz:'נתח סוכן אחד שאתה עובד איתו: מה ה־harness שלו עושה היום, ומה היית משנה בו קודם כדי לשפר תוצאות?',
  credit:'מבוסס על מסמך ההדרכה הפנימי של הצוות.' },
{ id:'m9', name:'RAG: שליפה וקריאת מסמכים', lv:'בינוני', time:'שבועות 4-5', dur:'כ־6 שעות', track:'core3',
  goal:'לחבר את המודל למידע שלך בצורה נכונה - ולהבין מתי RAG הוא הפתרון ומתי לא.',
  about:'חיבור המודל למידע האמיתי שלך: embeddings, חיפוש, ומתי זה נכון.',
  videos: [],
  lesson: [
    'RAG (Retrieval-Augmented Generation) הוא הפתרון הסטנדרטי לשאלה "איך המודל יענה על סמך המסמכים שלנו". הרעיון: במקום ללמד את המודל את המידע (אימון יקר ואיטי), שולפים בזמן אמת את הקטעים הרלוונטיים ומדביקים אותם לתוך ההקשר לפני השאלה. המודל עונה על סמך מה שקיבל - ולכן אפשר לתת לו מקורות, לעדכן מידע, ולבקר מה הוא ראה.',
    'הצנרת הבסיסית: מחלקים את המסמכים לקטעים (chunking), ממירים כל קטע לוקטור מספרי שמייצג את המשמעות שלו (embedding), ושומרים במסד וקטורי. על שאלה, ממירים גם אותה לוקטור, מוצאים את הקטעים הקרובים ביותר, ומצרפים אותם לפרומפט. כל שלב כאן יכול להיות צוואר הבקבוק של האיכות.',
    'הטעויות הנפוצות: חיתוך גרוע (קטעים חותכים משפט באמצע או מערבבים נושאים), שליפה של מעט מדי או הרבה מדי קטעים, וציפייה שהמודל "יבין" מקטע חתוך מה שאדם היה מבין מהמסמך כולו. רוב שיפורי ה-RAG בעולם האמיתי הם בשליפה ובחיתוך, לא במודל.',
    'מתי RAG לא הפתרון: כשהמידע מתעדכן מהר מדי, כשצריך סיכום של כל הקורפוס (ולא קטעים נקודתיים), או כשחלון הקשר גדול מספיק כדי להדביק הכל. לפעמים הכלי הנכון הוא פשוט חיפוש מילות מפתח ותו לא.'
  ],
  quiz:'הוסף לצ׳אטבוט שלך (מודול 4) שליפה על קבוצת מסמכים קטנה משלך. בדוק: על אילו שאלות הוא עונה טוב, ועל אילו הוא מחטיא - ולמה.',

    'מערכת AI היא משטח תקיפה חדש. לא רק בגלל שהיא מחזיקה מידע, אלא בגלל שהיא מבצעת פעולות על סמך טקסט - וטקסט יכול להיות זדוני. הרשימה הידועה היא OWASP Top 10 for LLM Applications, וכדאי לעבור עליה ולהכיר כל סיכון בשמו.',
    'הסיכון המרכזי הוא prompt injection: תוכן שהמערכת קוראת (מייל, מסמך, דף אינטרנט) מכיל הוראות זדוניות, והמודל - שלא מבדיל בין הוראות שלך להוראות בתוך דאטה - עלול לבצע אותן. אם הסוכן שלך קורא את הרשת ויש לו כלים, זה הסיכון הראשון שצריך להבין.',
    'עקרונות הגנה מעשיים: הפרדה ברורה בין הוראות לדאטה (ולא לצפות שהמודל יעשה את זה לבד), הרשאות מינימליות לכלים (סוכן שרק קורא לא יכול לדלוף דרך כתיבה), נקודות אישור אנושי לפעולות מסוכנות, סינון ולוגים על קלט ופלט, וחשיבה על מה קורה כשהמודל טועה או מופעל.',
    'גם בעבודה היומיומית הפשוטה: שים לב מה אתה מדביק לתוך כלים חיצוניים. מידע פנימי, מפתחות API ופרטי לקוחות לא נכנסים לשירות שהארגון לא אישר.'
  ],
  quiz:'מצא דוגמה אחת לסיכון OWASP בעבודה שלך (אמיתית או היפותטית) וכתוב איך היית מתגונן מפניה. הבא לדיון בישיבת צוות.',
  credit:'מבוסס על OWASP Top 10 for LLM Applications ועל מסמך ההדרכה הפנימי של הצוות.' },
{ id:'m24', name:'כלים, function calling ו-MCP', lv:'בינוני', time:'שבועות 4-5', dur:'כ־4 שעות', track:'core3',
  goal:'להבין איך מודל מפעיל כלים בפועל, ואיך MCP מסדיר את החיבור בין סוכנים למערכות חיצוניות.',
  about:'המנגנון שבין "צ׳אט" ל"סוכן": קריאת פונקציות, תכנון כלים, ותקן החיבור MCP.',
  videos: [],
  lesson: [
    'הצעד שהופך מודל שפה לסוכן הוא יכולת להפעיל כלים. המכניקה פשוטה יותר משהיא נשמעת: אתה מגדיר ל-API רשימת כלים - לכל כלי שם, תיאור וסכמה של הפרמטרים. כשהמודל מחליט שכלי נחוץ, הוא מחזיר בקשה מובנית (שם הכלי + ארגומנטים ב-JSON), הקוד שלך מריץ את הפונקציה, ואת התוצאה אתה מחזיר למודל כהודעה חדשה. הלולאה הזו - החלטה, הרצה, תצפית - היא הלב של כל סוכן.',
    'איכות הסכמה קובעת איכות השימוש: שמות ברורים, תיאורים שמסבירים מתי להשתמש בכלי (ومتי לא), ופרמטרים מדויקים. מודל שמקבל 40 כלים מתבלבל; עדיף מעט כלים מוגדרים היטב. וכלל בטיחות שחוזר ממודול האבטחה: כלי הוא הרשאה - תן לסוכן את המינימום שהמשימה דורשת.',
    'עד לא מזמן כל חיבור כזה נכתב מאפס לכל שילוב: הסוכן שלך מול GitHub, מול Drive, מול בסיס הנתונים - כל אחד אינטגרציה נפרדת. <b>MCP</b> (Model Context Protocol, תקן פתוח שיזמה Anthropic) מסדיר את זה: שרת MCP חושף כלים, משאבים ותבניות פרומפט בפרוטוקול אחיד, וכל אפליקציה תואמת יכולה להתחבר אליו - בדיוק כפי ש-USB מסדיר חיבור חומרה.',
    'הארכיטקטורה: האפליקציה שלך מארחת client אחד לכל שרת, והשרת יכול לרוץ מקומית כתהליך-בן או מרוחק. סביב התקן צמחה מערכת אקולוגית של שרתים מוכנים (מערכת קבצים, שליפת רשת, כלים ארגוניים) - כך שבמקום לכתוב אינטגרציה, לפעמים מספיק לחבר שרת קיים.',
    'מתי לבנות שרת MCP משלך: כשיש מערכת פנימית שסוכנים רבים צריכים, כשאותה יכולת נדרשת בכמה אפליקציות, או כשרוצים לתת לצוותים אחרים חיבור מבוקר למערכת שלך. מתי לא: לכלי חד-פעמי שרק הצ׳אטבוט שלך משתמש בו - שם function calling פשוט מספיק.'
  ],
  quiz:'הוסף לצ׳אטבוט שלך כלי אחד דרך function calling (למשל חיפוש בקבצים של הפרויקט), ואז קרא על MCP וסרטט: איך היית הופך את הכלי הזה לשרת MCP. מה נדרש מעבר למה שכבר בנית?',
  credit:'מבוסס על מסמך ההדרכה הפנימי של הצוות · רקע נוסף: הקורס הפתוח MCP: Build Rich-Context AI Apps (DeepLearning.AI ו-Anthropic).' },

{ id:'m13', name:'צווארי בקבוק ב-GPU ובשרתים', lv:'מתקדם', time:'מסלול תשתיות', dur:'כ־4 שעות', track:'advA',
  goal:'להבין למה שרתי AI הם בעיה אמיתית, ומה קורה כשהביצועים לא מספיקים.',
  about:'הצד הפיזי של AI: למה זה איטי, למה זה יקר, ומה עושים ביחסי גומלין האלה.',
  videos: [ vid('hMs8VNRy5Ys', 'Deep Dive: Optimizing LLM inference'), vid('cl3MAhAr9-M', 'Decoder-only inference: a step-by-step deep dive') ],
  lesson: [
    'הצד הפיזי של AI: למה זה איטי, למה זה יקר, ומה עושים כשהביצועים לא מספיקים. כשמריצים מודל שפה על שרת, הזמן שלוקח לקבל תשובה תלוי בכמה גורמים: גודל המודל, כמות הבקשות במקביל, והאופן שבו המודל בנוי. הבנת יחסי הגומלין בין אלה - ולא רק "המודל איטי" - היא מה שמאפשרת לתקן.',
    'ההבחנה הבסיסית היא בין prefill ל-decode. בשלב ה-prefill המודל קורא את כל ההקשר שלך בבת אחת - שלב מקבילי ומהיר יחסית. בשלב ה-decode הוא כותב טוקן אחר טוקן, וכל טוקן תלוי בקודמו - שלב טורי שאי אפשר להאיץ במקביליות בקלות. לכן תשובות ארוכות איטיות, ולכן ההקשר הארוך מתומחר אחרת.',
    'GPU הוא משאב יקר ומוגבל. השאלות המעשיות: כמה בקשות אפשר לשרת במקביל על אותו כרטיס, מתי משתלם לפצל בין כמה כרטיסים, ומה הטרייד-אוף בין latency (זמן לתשובה אחת) ל-throughput (כמה תשובות בשנייה).',
    'כללי אצבע: תגובה ארוכה = יקר; הרבה משתמשים במקביל = צריך תכנון תור; ותשובה איטית לפעמים פירושה בעיה בשרת, לא במודל. כשהביצועים לא מספיקים, הבחירה בין אופציות (מודל קטן יותר, שרת גדול יותר, או אופטימיזציה של הקוד) מתחילה מהבנת מה בדיוק צוואר הבקבוק.'
  ],
  quiz:'קח שירות שאתה מכיר ונסה לאבחן: מה צוואר הבקבוק שלו כשהוא איטי? מה היית בודק קודם - המודל, השרת, או הקוד?',
  credit:'מבוסס על רשימת הלמידה של זיו בקר ועל מסמך ההדרכה הפנימי של הצוות.' },
{ id:'m14', name:'רמת הדיוק: FP32, FP16, BF16, FP8', lv:'מתקדם', time:'מסלול תשתיות', dur:'כ־2 שעות', track:'advA',
  goal:'להבין מה זה דיוק מספרי, ולמה כולם מדברים על 16 ביט ו-8 ביט.',
  about:'המספרים מאחורי המודל: מה ההבדל בין דיוק שונה, ולמה זה משנה למהירות ולזיכרון.',
  videos: [],
  lesson: [
    'מודל שפה הוא, ברמה הטכנית, אוסף ענק של מספרים (המשקלות). הדיוק שבו כל מספר נשמר - כמה ביטים - קובע כמה זיכרון המודל תופס, כמה מהר הוא רץ, ועד כמה התוצאות מדויקות. זה אחד הטרייד-אופים הכי בסיסיים בהנדסת AI.',
    'FP32 (32 ביט, דיוק מלא) הוא הסטנדרט ההיסטורי של מדעי המחשב - אבל גדול ואיטי. FP16 (16 ביט) חותך את הזיכרון בחצי ומאיץ פי שניים בערך, אבל עלול לגרום לאי-דיוקים במספרים קטנים מאוד. BF16 (Brain Floating Point, 16 ביט) שומר על טווח דומה ל-FP32 עם דיוק נמוך יותר - וזו הסיבה שהוא הפך לסטנדרט באימון.',
    'FP8 (8 ביט) הוא הקצה הנוכחי: עוד חצייה של הזיכרון ועוד האצה, אבל דורש טיפול זהיר כדי לא לפגוע בדיוק. לא כל הכרטיסים תומכים בו, ולא כל מודל סובל אותו. הבחירה בין הרמות היא תמיד טרייד-אוף: זיכרון ומהירות מול דיוק ויציבות.'
  ],
  quiz:'קח מודל שאתה עובד איתו ומצא באיזו רמת דיוק הוא רץ. מה המשמעות לזיכרון ולמהירות? מתי היית מעדיף לרדת או לעלות בדיוק?',
  credit:'מבוסס על מסמך ההדרכה הפנימי של הצוות. שים לב: מדריכים מסוימים ברשת לא מעודכנים ל-FP8 ומעלה.' },
{ id:'m15', name:'מבט פנימי: KV-cache, vLLM, שיטות שירות', lv:'מתקדם', time:'מסלול תשתיות', dur:'כ־5 שעות', track:'advA',
  goal:'להציץ מתחת למכסה המנוע של שרת ה-AI ולהבין מה קורה שם באמת.',
  about:'איך שרת AI באמת עובד: המטמון, שרת ההגשה, ומה קורה כשהוא מוגז.',
  videos: [ vid('9-Jl0dxWQs8', 'How might LLMs store facts · 3Blue1Brown'), vid('80bIUggRJf4', 'The KV Cache: Memory Usage in Transformers'), vid('McLdlg5Gc9s', 'What is vLLM? Efficient AI Inference for Large Language Models') ],
  lesson: [
    'שרת AI הוא לא רק "המודל על כרטיס". יש שם מכונה מתוחכמת: מטמון (cache) ששומר תוצאות ביניים כדי לא לחשב מחדש, מנגנון תזמור (scheduler) שמחליט איזו בקשה לשרת מתי, ואלגוריתמים שמנסחים את החישוב בצורה יעילה יותר. כשהשרת עמוס, כל אלה קורסים יחד.',
    'ה־KV-cache הוא הדוגמה הכי חשובה: כשהמודל כותב טוקן, הוא שומר את ה-key וה-value של כל הטוקנים הקודמים כדי שלא יצטרך לחשב אותם מחדש בכל צעד. זה חוסך זמן עצום - אבל ה-cache גדל עם כל טוקן, ובשיחה ארוכה הוא יכול לתפוס יותר זיכרון מהמודל עצמו. זו הסיבה ששרתים "מתמלאים" גם כשהמודל לא גדל.',
    'vLLM הוא אחד הפתרונות הנפוצים ביותר לשרת AI, והוא פותר בדיוק את הבעיות האלה: ניהול זיכרון חכם יותר (PagedAttention, השראה מזיכרון וירטואלי במערכות הפעלה), batching דינמי של בקשות, וממשקים נוחים. הבנת איך הוא עובד מסבירה למה הוא הפך לסטנדרט.',
    'סרטוני ה-YouTube בסוף המודול מסבירים את כל אלה בעומק. הם לא קלים - אבל אחרי המודולים הקודמים, הם יהיו הרבה יותר נגישים.'
  ],
  quiz:'איזה מהרכיבים האלה - KV-cache, scheduler, batching - הכי רלוונטי לעבודה שלך עכשיו? למה?',
  credit:'מבוסס על רשימת הלמידה של זיו בקר ועל מסמך ההדרכה הפנימי של הצוות.' },
{ id:'m16', name:'Quantization ומקביליות', lv:'מתקדם', time:'מסלול תשתיות', dur:'כ־4 שעות', track:'advA',
  goal:'להכיר את הטכניקות להרצת מודלים גדולים בזיכרון קטן יותר ובמהירות גבוהה יותר.',
  about:'איך מריצים מודל ענק על כרטיס קטן: הקטנת הדיוק, ופיצול העבודה בין כרטיסים.',
  videos: [ vid('mNE_d-C82lI', 'Which Quantization Method is Right for You? (GPTQ vs. GGUF vs. AWQ)'), vid('DdmgD5RMe1U', 'LLM Inference Optimization: Tensor, Data & Expert Parallelism') ],
  lesson: [
    'Quantization הוא הכלי הכי חשוב כשרוצים להריץ מודל גדול על חומרה מוגבלת: במקום לשמור כל משקל בדיוק מלא (16 ביט), שומרים ב-8, 4, או אפילו 2 ביט. זה חוסך זיכרון באופן דרמטי - מודל שדרש שני כרטיסים יכול להיכנס על אחד - אבל כל רמה מוסיפה אי-דיוק. האמנות היא למצוא את הנקודה שבה החיסכון שווה את הפגיעה.',
    'שיטות שונות עובדות אחרת: GPTQ מכויל את ה-quantization על דאטה אמיתי כדי לשמור על דיוק; GGUF מיועד להרצה על CPU וחומרה ביתית; AWQ שומר על דיוק של המשקלות החשובים ביותר. הבחירה תלויה בחומרה, במודל, ובכמה דיוק אתה מוכן לוותר.',
    'מקביליות (parallelism) היא הגישה ההפוכה: במקום להקטין את המודל, מפצלים אותו על פני כמה כרטיסים. Tensor parallelism מחלק כל שכבה בין הכרטיסים; Data parallelism משכפל את המודל ומחלק את הבקשות; Expert parallelism מנצל מבנה של מודלי MoE שבהם רק חלק מהרשת פעיל בכל פעם. כל אחת מתאימה למצב אחר.',
    'הסרטונים למטה מסבירים את שני הנושאים בפרוטרוט. זה החומר הכי טכני במסלול - אבל אם אתה עובד על תשתיות, זו הבסיס שלך.'
  ],
  quiz:'נתח את החומרה הזמינה לך: איזו שיטת quantization או parallelism היית בוחר, ולמה? מה המגבלה העיקרית?',
  credit:'מבוסס על רשימת הלמידה של זיו בקר ועל מסמך ההדרכה הפנימי של הצוות.' },

  lesson: [
    'אימון של מודל שפה גדול הוא אחד הפרויקטים ההנדסיים הכי מורכבים שקיימים. הוא מתחיל באיסוף נתונים: טריליוני טוקנים של טקסט, שצריך לסנן, לנקות ולארגן. איכות הנתונים קובעת את איכות המודל יותר מכל גורם אחר.',

{ id:'m20', name:'תרגיל מעשי: Benchmarking ל-vLLM ומדדי inference', lv:'מתקדם', time:'מסלול תשתיות', dur:'כ־3 שעות', track:'advA',
  goal:'למדוד ביצועי שירות AI במספרים אמיתיים - במקום להסתפק ב״מרגיש איטי״.',
  about:'אוצר המילים של מדידת inference ותרגיל מדידה אמיתי מול שרת vLLM.',
  videos: [],
  lesson: [
    '"השירות מרגיש איטי" הוא לא נתון. כשמודדים שרת inference עובדים עם אוצר מילים מוסכם: <b>TTFT</b> (Time To First Token) - כמה זמן עד שהתשובה מתחילה להופיע, קריטי לחוויית משתמש; <b>ITL/TPOT</b> (Inter-Token Latency) - קצב כתיבת הטוקנים אחרי שהתשובה התחילה; <b>latency</b> מקצה לקצה - כל הבקשה; ו<b>throughput</b> - כמה טוקנים או בקשות בשנייה השרת מספק בסך הכול.',
    'המדד החמישי הוא <b>Goodput</b>: לא כמה בקשות השרת מספק, אלא כמה בקשות הוא מספק תוך עמידה ביעדי השירות שהגדרת (למשל TTFT מתחת לשנייה). זה המספר שמעניין מוצר אמיתי, כי throughput גבוה עם latency גרוע לא שווה כלום.',
    'איך מודדים נכון: מחממים את השרת לפני המדידה, משתמשים בפרומפטים מייצגים (אורך הקלט והפלט משנה את התוצאה דרמטית), מודדים ברמות עומס שונות (בקשה אחת, 8 במקביל, 32 במקביל), ומסתכלים על אחוזונים (p50, p90, p99) ולא על ממוצעים - הזנב הוא מה שהמשתמשים זוכרים.',
    'המדדים האלה מתחברים ישירות למה שלמדת על prefill מול decode: TTFT מושפע בעיקר מה-prefill ומהתור, ו-ITL מקצב ה-decode הטורי. כשמדד יוצא מהתקן, ההבחנה הזו אומרת לך איפה לחפש את הבעיה.'
  ],
  quiz:'הרץ benchmark אמיתי: הגש מודל קטן בקוד פתוח דרך vLLM (על GPU של הצוות או כל GPU זמין - מודל קטן מספיק, לא צריך חישוב בתשלום), ומדד TTFT, ITL ו-throughput בבקשה אחת מול 8 בקשות במקביל. רשום p50 ו-p99, והסבר במשפט אחד מה קרה כשהעומס עלה.',
  credit:'מונחי המדידה מבוססים על תיעוד ה-benchmarking של Anyscale לשירות LLM · מבוסס על מסמך ההדרכה הפנימי של הצוות.' },
{ id:'m21', name:'LoRA: כוונון מודל בלי לאמן הכל מחדש', lv:'מתקדם', time:'מסלול מחקר', dur:'כ־3 שעות', track:'advB',
  goal:'להבין איך מכווננים מודל גדול למשימה ספציפית בעלות שמחשב רגיל יכול לשאת.',
  about:'כוונון יעיל של מודלים: הרעיון של LoRA, מתי הוא עובד, ומתי הוא לא הכלי הנכון.',
  videos: [],
  lesson: [
    'כוונון מלא (full fine-tuning) של מודל מעדכן את כל המשקלות: זה דורש זיכרון עצום (המודל, הגרדיאנטים והאופטימייזר ביחד), הרבה זמן GPU, ועלול לגרום ל"שכחה" של יכולות כלליות. בשביל רוב המשימות זה יותר מדי.',
    '<b>LoRA</b> (Low-Rank Adaptation) הופכת את הבעיה: במקום לעדכן את המשקלות עצמם, מקפיאים את המודל ומוסיפים ליד כל שכבה זוג מטריצות קטנות שמייצגות את השינוי. במקום ללמוד עדכון בגודל d×d, לומדים שתי מטריצות בגודל d×r ו-r×d כש-r קטן (למשל 16) - אחוזים בודדים מהפרמטרים, אותה תוצאה בקירוב.',
    'המשמעות המעשית עצומה: אפשר לכוונן מודל של מיליארדי פרמטרים על GPU יחיד, קובץ ה-adapter קטן (מגה-בייטים בודדים), אפשר להחזיק adapters שונים למשימות שונות ולהחליף ביניהם, ולמזג את ה-adapter למודל לפני פריסה. הגרסה הפרקטית הנפוצה היא QLoRA: המודל הבסיסי נטען מקוונטז ורק ה-adapters מתאמנים.',
    'מתי LoRA היא הכלי הנכון: ללמד סגנון, פורמט, או התנהגות בתחום. מתי לא: ללמד ידע עובדתי חדש - לזה RAG מתאים יותר, ולזכור שהמודל "יודע" רק מה שהיה בנתוני האימון.'
  ],
  quiz:'אמן adapter של LoRA על מודל קטן בקוד פתוח עם דאטה קטן משלך (סביבת notebook חינמית כמו Colab מספיקה למודל קטן - לא צריך חישוב בתשלום). תעד: על איזו משימה אימנת, כמה זמן לקח, ומה השתנה בפלט לעומת המודל הבסיסי.',
  credit:'מבוסס על מסמך ההדרכה הפנימי של הצוות (נושאי post-training).' },
{ id:'m22', name:'Distillation: מודל קטן שמחקה מודל גדול', lv:'מתקדם', time:'מסלול מחקר', dur:'כשעתיים', track:'advB',
  goal:'להבין איך מעבירים יכולות ממודל גדול ויקר למודל קטן וזול - ומתי זה משתלם.',
  about:'אחת הדרכים הנפוצות לייצר מודלים קטנים טובים: ללמד מהמודל הגדול עצמו.',
  videos: [],
  lesson: [
    'הרעיון בזיקוק (distillation) פשוט: לוקחים מודל גדול וחזק ("המורה"), ומשתמשים בו כדי לאמן מודל קטן ("התלמיד"). התלמיד לא לומד מהטקסט הגולמי לבד - הוא לומד לחקות את התשובות של המורה, כולל ההסתברויות שהמורה נותן לתשובות שונות. ככה עובר חלק גדול מהיכולת, בשבריר מעלות ההגשה.',
    'למה זה משנה בפרקטיקה: מודל קטן עונה מהר יותר, עולה פחות להריץ, ויכול לרוץ על חומרה צנועה או אפילו על מכשיר קצה. הרבה מהמודלים הקטנים והטובים שאתה פוגש בפרודקשן נוצרו בדיוק ככה.',
    'הטרייד-אוף: הזיקוק עובד הכי טוב כשמצמצמים את המשימה. תלמיד שמאומן על משימה צרה יכול להשתוות למורה בתחום שלה; תלמיד שמנסה להיות כללי כמו המורה יישאר חלש יותר. לכן הדפוס המעשי הוא: מודל גדול לפיתוח ולמקרים הקשים, מודל מזוקק לנתיב הצר והנפוץ בפרודקשן.',
    'החיבור למודולים הקודמים: זיקוק משתמש באותם מנגנוני אימון שלמדת, רק שהדאטה הוא פלט של מודל אחר. והוא פותר בצד האימון את אותה בעיית עלות שהקוונטיזציה פותרת בצד ההגשה.'
  ],
  quiz:'קח משימה צרה מהעבודה שלך: בנה עם מודל חזק 20-30 דוגמאות אימון איכותיות, ובדוק מודל קטן בקוד פתוח על אותה משימה - לפני ואחרי שראה את הדוגמאות. תעד את הפער ומה נסגר.',
  credit:'מבוסס על מסמך ההדרכה הפנימי של הצוות (נושאי post-training).' },
{ id:'m23', name:'מעבר ל-RAG בסיסי: Graph-RAG, hybrid ו-CAG', lv:'מתקדם', time:'מסלול מחקר', dur:'כ־3 שעות', track:'advB',
  goal:'להכיר את המשפחה שמעבר ל-RAG וקטורי ולבחור את הגישה הנכונה לשאלה הנכונה.',
  about:'מה עושים כשחיפוש דמיון על קטעים לא מספיק: גרפים, חיפוש היברידי, ו-cache במקום שליפה.',
  videos: [],
  lesson: [
    'ה-RAG הבסיסי שבנית שולף קטעים מבודדים לפי דמיון סמנטי. זה מצוין לשאלות כמו "מה כתוב במדיניות על X", אבל נכשל בשאלות רוחביות ("מה הנושאים המרכזיים בכל הדוחות") ובשאלות רב-שלביות ("מי מחובר למה דרך מה") - כי התשובה לא נמצאת בשום קטע בודד.',
    '<b>Graph-RAG</b> מטפל בזה בבניית ידע מובנה בשלב האינדוקס: מחלצים ישויות וקשרים מהמסמכים לתוך גרף ידע, ומסכמים קהילות של נושאים קרובים. בשאילתה, השליפה עובדת על הגרף - שכנויות, מסלולים וקהילות - ולא רק על קטעים בודדים. העלות: אינדוקס כבד ויקר בהרבה מראש.',
    '<b>חיפוש היברידי</b> הוא שילוב פשוט וחזק: חיפוש מילות מפתח קלאסי לצד חיפוש וקטורי. קריטי כשהשאילתות כוללות מזהים, מספרי דגם או קודי שגיאה שחיפוש סמנטי מתפספס. <b>CAG</b> (Cache-Augmented Generation) היא הכיוון ההפוך: כשהקורפוס קטן, טוענים אותו כולו לחלון הקשר מראש ומוותרים בכלל על שליפה.',
    'איך בוחרים: RAG וקטורי הוא ברירת המחדל; היברידי כשיש מילות מפתח קריטיות; גרף כשהשאלות יחסיות או רוחביות והתקציב מאפשר; חלון ארוך כשהקורפוס נכנס כולו בזיכרון. רוב המערכות האמיתיות משלבות.'
  ],
  quiz:'חזור לקורפוס מהתרגיל ב-RAG הבסיסי. נסח שלוש שאלות יחסיות או רוחביות שה-RAG הווקטורי עונה עליהן רע, ותכנן איך אינדוקס גרפי היה עונה עליהן - אילו ישויות וקשרים היו חייבים להיות בגרף.',
  credit:'מבוסס על מסמך ההדרכה הפנימי של הצוות (נושאי RAG מתקדמים).' }
];
var LV_DOT = { 'בסיס': 'dot-basic', 'בינוני': 'dot-mid', 'מתקדם': 'dot-adv' };
function getDone(){ try { return JSON.parse(localStorage.getItem('deus-progress') || '{}'); } catch(e){ return {}; } }
function setDone(id, val){ var d = getDone(); if (val) d[id] = 1; else delete d[id]; localStorage.setItem('deus-progress', JSON.stringify(d)); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function homeView(){
  var done = getDone();
  var total = MODULES.length;
  var nDone = Object.keys(done).length;
  var html = '';
  html += '<section class="hero"><div class="kicker">חפיפה לצוות ה-AI</div>';
  html += '<h1>הדרך שלך<br>לתוך הצוות.</h1>';
  html += '<p>מסלול מסודר: שלבי ליבה, מסלולי העמקה, שיעורים, סרטונים ותרגילים. הכל כאן, בקצב שלך.</p>';
  html += '<div class="cta"><button class="primary" onclick="goAnchor(\'stages\')">להתחיל במסלול</button><a class="secondary" href="#/" data-anchor="how">איך זה עובד</a></div>';
  html += '<div class="heroline">25 מודולים · 3 שלבי ליבה · 2 מסלולי העמקה אופציונליים</div></section>';
  html += '<section class="progress"><div class="in"><span class="lbl">התקדמות במסלול</span><div class="bar"><div class="fill" style="width:' + Math.round(nDone/total*100) + '%"></div></div><span class="num">' + nDone + ' מתוך ' + total + '</span></div></section>';
  html += '<section class="how" id="how"><h2>איך זה עובד</h2><ul>';
  html += '<li>עוברים את שלבי הליבה לפי הסדר, כל מודול בקצב שלך.</li>';
  html += '<li>כל מודול כולל שיעור מקוצר שמכוון את הלמידה, סרטונים מוטמעים ותרגיל לסיום.</li>';
  html += '<li>מסמנים מודולים שהושלמו כדי לעקוב אחרי ההתקדמות.</li>';
  html += '<li>אחרי שלב 3 אפשר לבחור מסלול העמקה לפי התפקיד.</li>';
  html += '</ul></section>';
  html += '<div class="filters" id="stages"><div class="fgroup"><span class="flabel">רמה</span><div class="chips" id="chips-lv"></div></div><div class="fgroup"><span class="flabel">סוג</span><div class="chips" id="chips-type"></div></div></div>';
  TRACKS.forEach(function(t){
    html += '<section class="stage' + (t.id.indexOf('adv') === 0 ? ' adv' : '') + '" data-track="' + t.id + '"><div class="shead"><h3><span class="n">' + t.num + '</span>' + t.name + '</h3><p>' + t.desc + '</p></div><div class="slist">';
    MODULES.filter(function(m){ return m.track === t.id; }).forEach(function(m){
      var isCore = t.id.indexOf('core') === 0;
      html += '<a class="mod" href="#/m/' + m.id + '" data-lv="' + m.lv + '" data-core="' + (isCore ? 1 : 0) + '">';
      html += '<span class="mod-main"><span class="mod-name">' + m.name + (isCore ? '' : '<span class="star">✦ בחירה</span>') + '</span>';
      html += '<span class="mod-meta">' + m.dur + '</span></span>';
      html += '<span class="mod-lv"><i class="' + LV_DOT[m.lv] + '"></i>' + m.lv + (done[m.id] ? '<span class="done-mark">✓</span>' : '') + '</span>';
      html += '</a>';
    });
    html += '</div></section>';
  });
  html += '<footer class="footer">נבנה עבור חפיפת צוות ה-AI · השיעורים באתר נכתבו במקור על בסיס מסמך ההדרכה הפנימי · הסרטונים מתארחים ב-YouTube, קרדיט ליוצרים: 3Blue1Brown וזיו בקר (רשימת ״חומרי לימוד בסיס llm״) · קוד המקור: <a href="https://github.com/lidorshimoni/deus-training">github.com/lidorshimoni/deus-training</a></footer>';
  return html;
}

function moduleView(id){
  var m = MODULES.find(function(x){ return x.id === id; });
  if (!m) return '<div class="page"><p class="text" style="margin-top:40px">המודול לא נמצא. <a class="back" href="#/">חזרה לדף הבית</a></p></div>';
  var t = TRACKS.find(function(x){ return x.id === m.track; });
  var isCore = m.track.indexOf('core') === 0;
  var done = getDone();
  var html = '<div class="page">';
  html += '<a class="back" href="#/">→ חזרה לדף הבית</a>';
  html += '<div class="eyebrow">' + t.name + ' · ' + (isCore ? 'ליבה' : 'בחירה') + '</div>';
  html += '<h1 class="ptitle">' + m.name + '</h1>';
  html += '<div class="pmeta">' + m.time + ' · ' + m.dur + ' · ' + m.lv + '</div>';
  html += '<div class="sec"><h4>מה לומדים כאן</h4><p class="text">' + m.about + ' ' + m.goal + '</p></div>';
  if (m.videos && m.videos.length) {
    html += '<div class="sec"><h4>צפייה</h4>';
    m.videos.forEach(function(v){
      html += '<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/' + v.id + '" title="' + v.cap + '" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><div class="vcap">' + v.cap + '</div></div>';
    });
    html += '</div>';
  }
  html += '<div class="sec lesson"><h4>השיעור</h4>' + m.lesson.map(function(p){ return '<p>' + p + '</p>'; }).join('') + '</div>';
  html += '<div class="sec"><h4>תרגיל</h4><div class="quiz"><div class="q-label">לפני שמסמנים</div>' + m.quiz + '</div></div>';
  html += '<div class="credit">' + m.credit + '</div>';
  html += '<button class="done-btn' + (done[m.id] ? ' is-done' : '') + '" onclick="toggleDone(\'' + m.id + '\')">' + (done[m.id] ? '✓ סומן כהושלם — לחיצה מסירה' : 'סמן כהושלם') + '</button>';
  html += '<div class="done-note">הסימון נשמר בדפדפן שלך בלבד, בלי שם ובלי מעקב.</div>';
  html += '</div>';
  return html;
}

function toggleDone(id){ setDone(id, !getDone()[id]); route(); }
function goAnchor(a){ location.hash = '#/'; setTimeout(function(){ var el = document.getElementById(a); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 60); }

var FLV = 'הכל', FTYPE = 'הכל';
function renderFilters(){
  var lvs = ['הכל', 'בסיס', 'בינוני', 'מתקדם'];
  var types = ['הכל', 'ליבה', 'בחירה'];
  document.getElementById('chips-lv').innerHTML = lvs.map(function(l){ return '<button class="chip' + (FLV === l ? ' on' : '') + '" onclick="setFLV(\'' + l + '\')">' + l + '</button>'; }).join('');
  document.getElementById('chips-type').innerHTML = types.map(function(t){ return '<button class="chip' + (FTYPE === t ? ' on' : '') + '" onclick="setFTYPE(\'' + t + '\')">' + t + '</button>'; }).join('');
  applyFilters();
}
function setFLV(l){ FLV = l; renderFilters(); }
function setFTYPE(t){ FTYPE = t; renderFilters(); }
function applyFilters(){
  document.querySelectorAll('a.mod').forEach(function(el){
    var ok = (FLV === 'הכל' || el.dataset.lv === FLV) && (FTYPE === 'הכל' || (FTYPE === 'ליבה' ? el.dataset.core === '1' : el.dataset.core === '0'));
    el.style.display = ok ? '' : 'none';
  });
  document.querySelectorAll('.stage').forEach(function(s){
    var any = Array.prototype.some.call(s.querySelectorAll('a.mod'), function(el){ return el.style.display !== 'none'; });
    s.style.display = any ? '' : 'none';
  });
}

function bindNav(){
  document.querySelectorAll('[data-anchor]').forEach(function(el){
    el.addEventListener('click', function(ev){ ev.preventDefault(); goAnchor(el.dataset.anchor); });
  });
}

function route(){
  var h = location.hash || '#/';
  var app = document.getElementById('app');
  var mm = h.match(/^#\/m\/(\w+)/);
  if (mm) {
    app.innerHTML = moduleView(mm[1]);
    window.scrollTo(0, 0);
  } else {
    app.innerHTML = homeView();
    renderFilters();
  }
  bindNav();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
